# Generated by hyprland.lua — edit the Lua file, not this output.
# Monitor
monitor = eDP-1,preferred,auto,1

# Startup applications
exec-once = swayosd-server
exec-once = kdeconnectd
exec-once = /home/pavleb/.config/hypr/xdg-portal-hyprland
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = waybar & hypridle
exec = swaybg -m fill -i /home/pavleb/.config/hypr/hong-kong-night.jpg
env = QT_QPA_PLATFORMTHEME,qt5ct

input {
    kb_layout = us,rs
    kb_variant = ,latin
    kb_model = 
    kb_rules = 
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    sensitivity = 0

    touchpad {
    natural_scroll = no
    disable_while_typing = false
    clickfinger_behavior = true
    }
}

general {
    gaps_in = 5
    gaps_out = 20
    border_size = 2
    col.active_border = rgb(cdd6f4)
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

misc {
    disable_hyprland_logo = yes
}

decoration {
    rounding = 10

    blur {
    enabled = true
    size = 1
    passes = 2
    }
}

animations {
    enabled = yes
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    preserve_split = yes
}

# Window manager settings
$mainMod = SUPER

# Main keybindings
bind = $mainMod, Q, exec, kitty  # Open terminal
bind = $mainMod SHIFT, X, killactive  # Close active window
bind = $mainMod, L, exec, hyprlock  # Lock screen
bind = $mainMod, M, exec, wlogout --protocol layer-shell  # Logout menu
bind = $mainMod SHIFT, M, exit  # Exit Hyprland
bind = $mainMod, E, exec, dolphin  # File manager
bind = $mainMod, V, togglefloating  # Toggle floating
bind = $mainMod, A, exec, rofi -show drun  # Application launcher
bind = $mainMod, P, pseudo  # Dwindle pseudotile
bind = $mainMod, S, exec, hyprshot -m output -o /home/pavleb/Pictures/Screenshots -c  # Screenshot output
bind = $mainMod, B, exec, firefox  # Firefox
bind = $mainMod, W, exec, pkill waybar || waybar  # Toggle Waybar

# Multimedia and laptop-specific keys
bind = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bind = , 122, exec, swayosd-client --output-volume lower
bind = , 123, exec, swayosd-client --output-volume raise
bind = , 256, exec, pamixer --default-source -t  # Microphone mute
bind = , 232, exec, swayosd-client --brightness lower
bind = , 233, exec, swayosd-client --brightness raise
bind = , 210, exec, asusctl led-mode -n  # Keyboard RGB profile

# Move focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Workspace scrolling
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Media controls
bind = $mainMod ALT, SPACE, exec, playerctl play-pause
bind = $mainMod ALT, N, exec, playerctl next
bind = $mainMod ALT, P, exec, playerctl previous
bind = , XF86AudioStop, exec, playerctl stop
bind = $mainMod, Print, exec, hyprshot -m active -o /home/pavleb/Pictures/Screenshots -z --clipboard-only
